apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: orders-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9090 }
          env:
            # The Job migrated the schema before this Deployment changed. The service never runs DDL.
            - name: SPRING_LIQUIBASE_ENABLED
              value: "false"
            - name: DB_URL
              value: {{ .Values.database.url | quote }}
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.database.appSecret }}, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.appSecret }}, key: password } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "2", memory: 1Gi }
